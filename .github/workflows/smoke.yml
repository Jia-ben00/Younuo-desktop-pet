name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（纯逻辑层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 刻意只装 pytest：测试只覆盖 pet_core（纯逻辑），不 import PyQt5。
      # 因此这一步不需要 Qt、不需要图形环境，跑得很快。
      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: 语法检查
        run: python -m compileall -q v10/src

      - name: 运行单元测试
        run: python -m pytest tests/ -v

  lint-syntax:
    name: 全版本语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # V1-V10 每个版本都是一个独立单文件程序，历史版本不再维护，
      # 但至少要保证语法没坏（防止有人误改坏历史快照）。
      - name: 检查所有历史版本的语法
        run: |
          set -e
          for f in $(find v1 v2 v3 v4 v5 v6 v7 v8 v9 v10 -name '*.py' 2>/dev/null); do
            echo "checking $f"
            python -m py_compile "$f"
          done
